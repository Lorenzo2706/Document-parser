[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "slide-parser"
version = "0.1.0"
description = "Convert PDF and PPTX slide decks to LLM-ready Markdown with zero data loss."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Slide-parser contributors" }]
keywords = ["pdf", "pptx", "markdown", "llm", "docling", "ocr", "slides"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "docling>=2.0",
    "python-pptx>=1.0",
    "pytesseract>=0.3.10",
    "Pillow>=10",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
slide-parser = "slide_parser.cli:app"

[project.urls]
Repository = "https://github.com/lorenzo2706/slide-parser"

[tool.hatch.build.targets.wheel]
packages = ["src/slide_parser"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length is governed by formatter, not the linter
    "B008",  # typer.Option / typer.Argument as default is the canonical pattern
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
